services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prueba-tecnica-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: prueba-tecnica-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-prueba}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prueba}
      POSTGRES_DB: ${DB_DATABASE:-prueba_tecnica}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USERNAME:-prueba} -d ${DB_DATABASE:-prueba_tecnica}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: prueba-tecnica-pgweb
    restart: unless-stopped
    ports:
      - "8080:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://${DB_USERNAME:-prueba}:${DB_PASSWORD:-prueba}@postgres:5432/${DB_DATABASE:-prueba_tecnica}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: prueba-tecnica-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prueba-tecnica-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
