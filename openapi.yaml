openapi: 3.0.0
paths:
  /api:
    get:
      operationId: AppController_getHello
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - App
  /api/auth/register:
    post:
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: El correo electrónico ya está registrado
      summary: Registrar un nuevo usuario
      tags: &ref_0
        - Autenticación
  /api/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Inicio de sesión correcto
          content:
            application/json:
              schema:
                properties:
                  accessToken:
                    type: string
                    description: Token de acceso JWT
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Credenciales inválidas
      summary: Iniciar sesión y obtener un token de acceso JWT
      tags: *ref_0
  /api/auth/profile:
    get:
      operationId: AuthController_profile
      parameters: []
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Token de autenticación faltante, inválido o expirado
      security:
        - bearer: []
      summary: Obtener el perfil del usuario autenticado
      tags: *ref_0
info:
  title: API de Prueba Técnica
  description: Documentación de la API en español
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: usuario@example.com
          description: Correo electrónico del usuario
        name:
          type: string
          example: Juan Pérez
          description: Nombre del usuario
          nullable: true
        password:
          type: string
          example: Contraseña123!
          description: Contraseña del usuario (mínimo 8 caracteres)
      required:
        - email
        - password
    User:
      type: object
      properties:
        id:
          type: number
          example: 1
          description: Identificador único del usuario
        email:
          type: string
          example: usuario@example.com
          description: Correo electrónico del usuario
        name:
          type: string
          example: Juan Pérez
          nullable: true
          description: Nombre del usuario
        createdAt:
          format: date-time
          type: string
          example: '2026-08-12T10:00:00.000Z'
          description: Fecha y hora de creación del usuario
        updatedAt:
          format: date-time
          type: string
          example: '2026-08-12T10:00:00.000Z'
          description: Fecha y hora de la última actualización
      required:
        - id
        - email
        - createdAt
        - updatedAt
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: usuario@example.com
          description: Correo electrónico del usuario
        password:
          type: string
          example: Contraseña123!
          description: Contraseña del usuario
      required:
        - email
        - password
